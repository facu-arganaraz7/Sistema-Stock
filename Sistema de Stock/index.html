<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Stock - Kiosco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#" class="nav-link active" data-view="agregar">Agregar Productos</a>
        <a href="#" class="nav-link" data-view="stock">Ver Stock</a>
    </div>

    <header>
        <span class="menu-btn" onclick="openNav()">&#9776;</span>
        <h1>Control de Stock - Kiosco</h1>
    </header>

    <main>
        <section id="agregarSection" class="content-section">
            <h2>Agregar Nuevo Producto</h2>
            <form id="productoForm">
                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" required>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Golosinas">Golosinas</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Cigarrillos">Cigarrillos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="detalle">Detalle:</label>
                    <textarea id="detalle" required></textarea>
                </div>
                <div class="form-group">
                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="stock">Cantidad en Stock:</label>
                    <input type="number" id="stock" required>
                </div>
                <button type="submit" class="btn-primary">Agregar Producto</button>
            </form>
        </section>

        <section id="stockSection" class="content-section" style="display: none;">
            <h2>Stock Actual</h2>
            <div class="stock-container">
                <div class="stock-tables">
                    <div class="table-wrapper">
                        <h3>Bebidas</h3>
                        <div id="tablaBebidas" class="tabla-container"></div>
                    </div>
                    <div class="table-wrapper">
                        <h3>Golosinas</h3>
                        <div id="tablaGolosinas" class="tabla-container"></div>
                    </div>
                    <div class="table-wrapper">
                        <h3>Snacks</h3>
                        <div id="tablaSnacks" class="tabla-container"></div>
                    </div>
                    <div class="table-wrapper">
                        <h3>Cigarrillos</h3>
                        <div id="tablaCigarrillos" class="tabla-container"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal para editar productos -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Editar Producto</h2>
            <form id="editarForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editCategoria">Categoría:</label>
                    <select id="editCategoria" required>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Golosinas">Golosinas</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Cigarrillos">Cigarrillos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editNombre">Nombre:</label>
                    <input type="text" id="editNombre" required>
                </div>
                <div class="form-group">
                    <label for="editDetalle">Detalle:</label>
                    <textarea id="editDetalle" required></textarea>
                </div>
                <div class="form-group">
                    <label for="editPrecio">Precio:</label>
                    <input type="number" id="editPrecio" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="editStock">Cantidad en Stock:</label>
                    <input type="number" id="editStock" required>
                </div>
                <button type="submit" class="btn-primary">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
